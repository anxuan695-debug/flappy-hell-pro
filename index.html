<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Flappy Hell: Absolute Annihilation</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none}html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center}.game-container{width:100vw;height:100vh;position:relative;background:radial-gradient(circle,#500012 0%,#000 100%);overflow:hidden}canvas{display:block;width:100%;height:100%}.hud-top{position:absolute;top:15px;left:20px;right:20px;font-size:11px;font-weight:900;color:#ff0055;letter-spacing:.5px;pointer-events:none;display:flex;justify-content:space-between;text-shadow:0 0 12px rgba(255,0,85,.8);z-index:10}</style></head><body><div class="game-container"><div class="hud-top"><div>💀 <span id="rankTitle">DANH HIỆU: [TẬP SỰ]</span> | TRẠNG THÁI: <span id="tortureStatus" style="color:#ff0055">🔥 ANNIHILATION</span></div><div>TIME: <span id="timeVal">0.0s</span> | SCORE: <span id="scoreVal">00000</span></div></div><canvas id="gameCanvas"></canvas></div><script>const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}window.addEventListener('resize',resizeCanvas);resizeCanvas();let score=0,gameTime=0,isGameOver=!1,gameStarted=!1,screenShake=0,blindfoldTimer=0,flipScreenTimer=0,stealthTimer=0,currentDNAHash="#ANNIHILATION-π";const player={x:100,y:canvas.height/2,radius:13,vy:0,baseGravity:.9,lift:-13.8};let obstacles=[],bullets=[],particles=[];window.addEventListener('touchstart',handleInput,{passive:!7});window.addEventListener('click',handleInput);function handleInput(){if(!gameStarted||isGameOver){resetGame()}else{let e=gameTime>25?Math.random()*100:0;setTimeout(()=>{if(!isGameOver&&gameStarted){player.vy=player.lift;createParticles(player.x,player.y,'#ff0055',10)}})}}function resetGame(){score=0;gameTime=0;blindfoldTimer=0;flipScreenTimer=0;stealthTimer=0;obstacles=[];bullets=[];particles=[];isGameOver=!1;gameStarted=!0;screenShake=0;player.y=canvas.height/2;player.vy=0;updateHud()}function getMasteryRank(e){return e<12?{name:"[TẬP SỰ]",color:"#64748b"}:e<25?{name:"[THỨC TỈNH]",color:"#00ffcc"}:e<50?{name:"[CUỒNG LOẠN]",color:"#ffaa00"}:e<80?{name:"[BẤT TỬ]",color:"#ff00ff"}:e<120?{name:"[THẦN THÁNH]",color:"#0088ff"}:{name:"[HỦY DIỆT VĨNH HẰNG]",color:"#ff0000"}}function spawnStreamEntity(e){let t=Math.sin(.1*e*Math.PI)*1e4+Math.cos(.05*e*Math.E)*5e0,a=Math.abs(t),r="ANNIHILATE["+Math.floor(a).toString(16).toUpperCase().substring(0,5)+"]",i="hsl("+Math.floor(a%1*360)+", 100%, 55%)",s=Math.max(75,125-Math.floor(e*1.2)%50),o=35,l=canvas.height-s-35,c=o+Math.abs(Math.sin(.4*e))*(l-o);obstacles.push({x:canvas.width,top:c,bottom:canvas.height-c-s,name:r,color:i,fireTimer:0})}function updateHud(){document.getElementById('rankTitle').innerText=`DANH HIỆU: ${MasteryRankObj.name}`;document.getElementById('timeVal').innerText=`${gameTime.toFixed(1)}s`}let MasteryRankObj={name:"[TẬP SỰ]",color:"#64748b"};function createParticles(e,t,a,r){for(let i=0;i<r;i++)particles.push({x:e,y:t,vx:16*(Math.random()-.5),vy:16*(Math.random()-.5),life:25,color:a})}function update(){if(!gameStarted||isGameOver)return;gameTime+=.016;score=Math.floor(60*gameTime);MasteryRankObj=getMasteryRank(gameTime);let e=1+Math.pow(.12*gameTime,1.6);if(score>0&&score%500===0&&0===flipScreenTimer){flipScreenTimer=120;screenShake=70;document.getElementById('tortureStatus').innerText="🔄 ĐẢO NGƯỢC 180°";document.getElementById('tortureStatus').style.color="#ffaa00"}flipScreenTimer>0&&flipScreenTimer--;if(score>0&&score%700===0&&0===stealthTimer){stealthTimer=100;document.getElementById('tortureStatus').innerText="👻 TÀNG HÌNH";document.getElementById('tortureStatus').style.color="#ff0055"}stealthTimer>0&&stealthTimer--;if(score>0&&score%400===0&&0===blindfoldTimer){blindfoldTimer=90;screenShake=65}blindfoldTimer>0?blindfoldTimer--:0===blindfoldTimer&&score%400>100&&0===flipScreenTimer&&0===stealthTimer&&(document.getElementById('tortureStatus').innerText="🔥 ANNIHILATION",document.getElementById('tortureStatus').style.color="#ff0055");screenShake>0&&screenShake--;let t=player.baseGravity+1.1*Math.sin(6*gameTime);player.vy+=t;player.y+=player.vy;(player.y>canvas.height-player.radius||player.y<player.radius)&&triggerGameOver();let a=Math.max(110,Math.floor(220/(.8*e)));(0===obstacles.length||obstacles[obstacles.length-1].x<canvas.width-a)&&spawnStreamEntity(gameTime);let r=9.0*e;for(let i=obstacles.length-1;i>=0;i--){let s=obstacles[i];s.x-=r;s.fireTimer++;let o=Math.max(5,Math.floor(24/e));if(s.fireTimer%o===0){let l=s.top+(canvas.height-s.bottom-s.top)/2,c=Math.atan2(player.y-l,player.x-s.x),m=(-22-.4*gameTime)*e*.65;bullets.push({x:s.x,y:l,vx:m*Math.cos(c),vy:m*Math.sin(c),radius:4.8,color:'#ff0055',age:0,isHoming:!0,isSplit:!1})}player.x+player.radius>s.x&&player.x-player.radius<s.x+70&&(player.y-player.radius<s.top||player.y+player.radius>canvas.height-s.bottom)&&triggerGameOver();s.x+70<0&&obstacles.splice(i,1)}for(let h=bullets.length-1;h>=0;h--){let d=bullets[h],g=Math.atan2(player.y-d.y,player.x-d.x);d.vx+=.9*Math.cos(g);d.vy+=.9*Math.sin(g);d.x+=d.vx;d.y+=d.vy;d.age++;if(14===d.age&&!d.isSplit){d.isSplit=!0;let p=Math.atan2(d.vy,d.vx),v=Math.hypot(d.vx,d.vy);bullets.push({x:d.x,y:d.y,vx:Math.cos(p+.7)*v,vy:Math.sin(p+.7)*v,radius:3.8,color:d.color,age:14,isHoming:!0,isSplit:!0});bullets.push({x:d.x,y:d.y,vx:Math.cos(p-.7)*v,vy:Math.sin(p-.7)*v,radius:3.8,color:d.color,age:14,isHoming:!0,isSplit:!0})}Math.hypot(player.x-d.x,player.y-d.y)<player.radius+d.radius&&triggerGameOver();(d.x<0||d.x>canvas.width+50||d.y<0||d.y>canvas.height)&&bullets.splice(h,1)}for(let y=particles.length-1;y>=0;y--){let u=particles[y];u.x+=u.vx;u.y+=u.vy;u.life--;u.life<=0&&particles.splice(y,1)}document.getElementById('scoreVal').innerText=String(score).padStart(5,'0');updateHud()}function triggerGameOver(){screenShake=110;createParticles(player.x,player.y,'#ff0055',100);let e=Math.floor(99999*gameTime).toString(16).toUpperCase();currentDNAHash=`#ANNIHILATE-${e.substring(0,4)}-π`;isGameOver=!0}function draw(){ctx.save();if(flipScreenTimer>0){ctx.translate(canvas.width,canvas.height);ctx.rotate(Math.PI)}screenShake>0&&ctx.translate(80*(Math.random()-.5),80*(Math.random()-.5));ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);obstacles.forEach(e=>{ctx.fillStyle=e.color;ctx.shadowBlur=45;ctx.shadowColor=e.color;ctx.fillRect(e.x,0,70,e.top);ctx.fillRect(e.x,canvas.height-e.bottom,70,e.bottom)});ctx.shadowBlur=0;bullets.forEach(e=>{ctx.fillStyle=e.color;ctx.shadowBlur=35;ctx.shadowColor=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,2*Math.PI);ctx.fill()});ctx.shadowBlur=0;particles.forEach(e=>{ctx.fillStyle=e.color;ctx.fillRect(e.x,e.y,4,4)});(0===stealthTimer||Math.floor(Date.now()/80)%2===0)&&(ctx.fillStyle='#ff0055',ctx.shadowBlur=stealthTimer>0?10:50,ctx.shadowColor='#ff0055',ctx.beginPath(),ctx.arc(player.x,player.y,player.radius,0,2*Math.PI),ctx.fill(),ctx.shadowBlur=0);if(blindfoldTimer>0){ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#ff0055';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText('⚠️ VÙNG MÙ HỦY DIỆT!',canvas.width/2,canvas.height/2)}if(!gameStarted){ctx.fillStyle='#ff0055';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText('💀 FLAPPY HELL: ABSOLUTE ANNIHILATION 💀',canvas.width/2,canvas.height/2-25);ctx.fillStyle='#64748b';ctx.font='13px system-ui';ctx.fillText('Cỗ máy hủy diệt tuyệt đối - Chạm để tự sát',canvas.width/2,canvas.height/2+20)}else if(isGameOver){ctx.fillStyle='rgba(0,0,0,0.96)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#ff0055';ctx.font='bold 28px system-ui';ctx.textAlign='center';ctx.fillText('ANNIHILATION (DIỆT VONG HOÀN TOÀN)',canvas.width/2,canvas.height/2-35);ctx.fillStyle=MasteryRankObj.color;ctx.font='bold 17px system-ui';ctx.fillText(`DANH HIỆU: ${MasteryRankObj.name}`,canvas.width/2,canvas.height/2-5);ctx.fillStyle='#00ffcc';ctx.font='14px system-ui';ctx.fillText(`MÃ DNA TRẬN ĐẤU: ${currentDNAHash}`,canvas.width/2,canvas.height/2+25);ctx.fillStyle='#64748b';ctx.font='13px system-ui';ctx.fillText('↺ Chạm màn hình để tiếp tục chịu hình phạt',canvas.width/2,canvas.height/2+60)}ctx.restore()}function loop(){update();draw();requestAnimationFrame(loop)}loop();</script></body></html>
