name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova globally
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create myApp com.flappy.hell FlappyHell
          cd myApp
          cordova platform add android@12.0.0
          cp ../index.html www/index.html

      - name: Use stable Gradle version
        run: |
          cd myApp/platforms/android
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" > gradle/wrapper/gradle-wrapper.properties

      - name: Build APK Debug
        run: |
          cd myApp
          cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
